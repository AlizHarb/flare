<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flare_gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F59E0B" />
      <stop offset="0.5" stop-color="#EC4899" />
      <stop offset="1" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Main Flare Shape -->
  <g filter="url(#glow)">
    <path d="M256 32C256 32 280 200 480 256C280 312 256 480 256 480C256 480 232 312 32 256C232 200 256 32 256 32Z" fill="url(#flare_gradient)"/>
  </g>
  
  <!-- Inner Bright Core -->
  <circle cx="256" cy="256" r="40" fill="white" fill-opacity="0.9" />
  
  <!-- Cross Rays -->
  <path d="M256 100V412M100 256H412" stroke="white" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>
</svg>

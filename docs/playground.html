<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flare Playground - Live Demo</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Inter', sans-serif;
            --font-display: 'Outfit', sans-serif;

            --color-primary-50: #f0f9ff;
            --color-primary-100: #e0f2fe;
            --color-primary-200: #bae6fd;
            --color-primary-300: #7dd3fc;
            --color-primary-400: #38bdf8;
            --color-primary-500: #0ea5e9;
            --color-primary-600: #0284c7;
            --color-primary-700: #0369a1;
            --color-primary-800: #075985;
            --color-primary-900: #0c4a6e;
            --color-primary-950: #082f49;

            --color-gray-850: #1f2937;
            --color-gray-900: #111827;
            --color-gray-950: #030712;
        }
        @variant dark (&:where(.dark, .dark *));
    </style>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Flare Assets -->
    <link rel="stylesheet" href="css/flare.css">
    <script src="js/flare.js"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        .toast-enter { opacity: 0; transform: scale(0.9) translateY(20px); }
        .toast-enter-active { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .toast-leave { opacity: 1; transform: scale(1) translateY(0); }
        .toast-leave-active { transition: all 0.3s ease-in; opacity: 0; transform: scale(0.9) translateY(-20px); }
        
        /* Override Flare Container for Playground */
        [data-flare-container] {
            position: absolute !important;
            height: 100% !important;
            max-height: 100% !important;
            z-index: 10 !important;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-800 dark:text-gray-200 font-sans antialiased h-screen overflow-hidden flex flex-col"
      x-data="playground()"
      :class="{ 'dark': isDark }">

    <!-- Background Gradients -->
    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
        <div class="absolute top-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-primary-500/10 blur-[120px]"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-purple-500/10 blur-[120px]"></div>
    </div>

    <!-- Header -->
    <header class="relative z-10 flex items-center justify-between px-6 py-4 border-b border-gray-200/50 dark:border-gray-800/50 bg-white/50 dark:bg-gray-950/50 backdrop-blur-xl">
        <div class="flex items-center gap-4">
            <a href="index.html" class="flex items-center gap-2 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                <span class="text-sm font-medium">Back to Docs</span>
            </a>
            <div class="h-6 w-px bg-gray-200 dark:bg-gray-800"></div>
            <h1 class="text-xl font-display font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary-500 to-purple-600">Flare Playground</h1>
        </div>

        <button @click="toggleTheme()" class="p-2 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white transition-colors bg-gray-100 dark:bg-gray-800 rounded-lg">
            <svg x-show="!isDark" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
            <svg x-show="isDark" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="display: none;">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
        </button>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex relative z-10 overflow-hidden">
        <!-- Controls Sidebar -->
        <aside class="w-80 border-r border-gray-200/50 dark:border-gray-800/50 bg-white/50 dark:bg-gray-950/50 backdrop-blur-xl p-6 overflow-y-auto scrollbar-hide">
            <div class="space-y-8">
                <!-- Theme Selection -->
                <div class="space-y-3">
                    <label class="text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wider">Theme</label>
                    <div class="grid grid-cols-3 gap-2">
                        <template x-for="t in themes" :key="t.value">
                            <button @click="config.theme = t.value"
                                    class="relative px-2 py-2.5 text-xs font-medium rounded-xl border transition-all duration-200 overflow-hidden group"
                                    :class="config.theme === t.value ? 'border-primary-500 bg-primary-50 dark:bg-primary-500/10 text-primary-600 dark:text-primary-400 shadow-sm' : 'border-gray-200 dark:border-gray-800 hover:border-gray-300 dark:hover:border-gray-700 text-gray-600 dark:text-gray-400 bg-white dark:bg-gray-900'">
                                <div class="absolute inset-0 bg-gradient-to-br from-white/50 to-transparent dark:from-white/5 dark:to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                <span class="relative z-10" x-text="t.label"></span>
                            </button>
                        </template>
                    </div>
                </div>

                <!-- Stacking Toggle -->
                <div class="flex items-center justify-between p-3 rounded-xl bg-gray-50 dark:bg-gray-900/50 border border-gray-100 dark:border-gray-800">
                    <div class="flex flex-col">
                        <span class="text-sm font-medium text-gray-700 dark:text-gray-200">Stacking</span>
                        <span class="text-xs text-gray-500 dark:text-gray-500">3D stack effect</span>
                    </div>
                    <button @click="config.stacking = !config.stacking" 
                            class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2"
                            :class="config.stacking ? 'bg-primary-600' : 'bg-gray-200 dark:bg-gray-700'">
                        <span class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"
                              :class="config.stacking ? 'translate-x-5' : 'translate-x-0'"></span>
                    </button>
                </div>

                <hr class="border-gray-200 dark:border-gray-800/50">

                <!-- Type -->
                <div class="space-y-3">
                    <label class="text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wider">Type</label>
                    <div class="grid grid-cols-2 gap-2">
                        <template x-for="t in types" :key="t.value">
                            <button @click="toastConfig.type = t.value"
                                    class="flex items-center justify-center gap-2 px-3 py-2.5 text-sm font-medium rounded-xl border transition-all duration-200"
                                    :class="toastConfig.type === t.value ? 'border-primary-500 bg-primary-50 dark:bg-primary-500/10 text-primary-600 dark:text-primary-400 shadow-sm' : 'border-gray-200 dark:border-gray-800 hover:border-gray-300 dark:hover:border-gray-700 text-gray-600 dark:text-gray-400 bg-white dark:bg-gray-900'">
                                <span x-text="t.label"></span>
                            </button>
                        </template>
                    </div>
                </div>

                <!-- Position -->
                <div class="space-y-3">
                    <label class="text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wider">Position</label>
                    <div class="relative">
                        <select x-model="config.position" class="w-full appearance-none h-11 px-4 rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 text-gray-700 dark:text-gray-300 focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition-all cursor-pointer">
                            <option value="top-right">Top Right</option>
                            <option value="top-center">Top Center</option>
                            <option value="top-left">Top Left</option>
                            <option value="bottom-right">Bottom Right</option>
                            <option value="bottom-center">Bottom Center</option>
                            <option value="bottom-left">Bottom Left</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Content -->
                <div class="space-y-4">
                    <div class="space-y-2">
                        <label class="text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wider">Title</label>
                        <input type="text" x-model="toastConfig.title" class="w-full h-11 px-4 rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 text-gray-700 dark:text-gray-300 focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition-all placeholder-gray-400" placeholder="Enter title...">
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wider">Message</label>
                        <textarea x-model="toastConfig.message" rows="3" class="w-full p-4 rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 text-gray-700 dark:text-gray-300 focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition-all placeholder-gray-400 resize-none" placeholder="Enter message..."></textarea>
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wider">Duration (ms)</label>
                        <input type="number" x-model="toastConfig.duration" class="w-full h-11 px-4 rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 text-gray-700 dark:text-gray-300 focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition-all placeholder-gray-400" placeholder="5000">
                        <p class="text-xs text-gray-500">Set to 0 for persistent toast</p>
                    </div>
                </div>

                <!-- Action -->
                <button @click="showToast()" class="w-full py-3.5 px-4 bg-gradient-to-r from-primary-500 to-primary-600 hover:from-primary-600 hover:to-primary-700 text-white font-semibold rounded-xl shadow-lg shadow-primary-500/30 transform hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                    Show Toast
                </button>
            </div>
        </aside>

        <!-- Preview Area -->
        <div class="flex-1 relative bg-gray-100/50 dark:bg-black/20">
            <!-- Grid Pattern -->
            <div class="absolute inset-0" style="background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 24px 24px; opacity: 0.3;"></div>
            
            <!-- Flare Toast Container (Replicated from Blade) -->
            <div
                x-data="flareToasts({
                    position: config.position,
                    expanded: !config.stacking,
                    maxVisible: 5
                })"
                x-on:flare-toast-show.window="showToast($event.detail)"
                data-flare-container
                :data-position="config.position"
                :data-theme="config.theme"
                :data-stacking="config.stacking ? 'true' : 'false'"
                :data-expanded="expanded ? 'true' : 'false'"
                x-init="$watch('config.stacking', value => expanded = !value)"
            >

                <template x-for="(toast, index) in visibleToasts" :key="toast.id">
                    <div
                        x-show="toast.visible"
                        data-flare-toast
                        :data-variant="toast.variant || 'info'"
                        :data-state="toast.state"
                        :data-paused="toast.paused ? 'true' : 'false'"
                        :data-theme="config.theme"
                        tabindex="0"
                        role="alert"
                        aria-live="polite"
                        x-on:mouseenter="expandOnHover()"
                        x-on:mouseleave="collapseOnLeave()"
                        x-on:focusin="pauseToast(toast.id)"
                        x-on:focusout="resumeToast(toast.id)"
                        :style="{ zIndex: toast.zIndex }"
                        :class="{
                            'bg-white/80 dark:bg-gray-800/80 backdrop-blur-sm shadow-lg border border-gray-200/50 dark:border-gray-700/50': config.theme === 'modern',
                            'bg-white dark:bg-gray-800 border-l-4 shadow-sm': config.theme === 'classic',
                            'bg-gradient-to-r text-white shadow-lg': config.theme === 'vibrant',
                            'from-green-500 to-emerald-600': config.theme === 'vibrant' && toast.variant === 'success',
                            'from-red-500 to-rose-600': config.theme === 'vibrant' && toast.variant === 'danger',
                            'from-orange-500 to-red-500': config.theme === 'vibrant' && toast.variant === 'warning',
                            'from-blue-500 to-cyan-600': config.theme === 'vibrant' && (toast.variant === 'info' || !toast.variant)
                        }"
                    >
                        <div data-flare-content>
                            <!-- Icon based on variant -->
                            <div data-flare-icon :data-variant="toast.variant || 'info'" :class="{'text-white': config.theme === 'vibrant'}">
                                <!-- Success Icon -->
                                <svg x-show="toast.variant === 'success'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd" />
                                </svg>

                                <!-- Warning Icon -->
                                <svg x-show="toast.variant === 'warning'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                    <path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495zM10 5a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0v-3.5A.75.75 0 0110 5zm0 9a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" />
                                </svg>

                                <!-- Danger Icon -->
                                <svg x-show="toast.variant === 'danger'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z" clip-rule="evenodd" />
                                </svg>

                                <!-- Info Icon (default) -->
                                <svg x-show="!toast.variant || toast.variant === 'info'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a.75.75 0 000 1.5h.253a.25.25 0 01.244.304l-.459 2.066A1.75 1.75 0 0010.747 15H11a.75.75 0 000-1.5h-.253a.25.25 0 01-.244-.304l.459-2.066A1.75 1.75 0 009.253 9H9z" clip-rule="evenodd" />
                                </svg>
                            </div>

                            <!-- Content -->
                            <div data-flare-text :class="{'text-white': config.theme === 'vibrant'}">
                                <div x-show="toast.heading" x-text="toast.heading" data-flare-heading :class="{'text-white': config.theme === 'vibrant'}"></div>
                                <div x-text="toast.text" data-flare-message :class="{'text-white/90': config.theme === 'vibrant'}"></div>
                            </div>

                            <!-- Progress Bar -->
                            <div 
                                x-show="toast.duration > 0"
                                class="absolute bottom-0 left-0 h-1 bg-current opacity-20 transition-all duration-100 ease-linear"
                                :style="{ width: toast.progress + '%' }"
                                :class="{'bg-white': config.theme === 'vibrant'}"
                            ></div>

                            <!-- Close button -->
                            <button
                                x-on:click="dismissToast(toast.id)"
                                type="button"
                                data-flare-close
                                aria-label="Dismiss notification"
                                :class="{'text-white/70 hover:text-white': config.theme === 'vibrant'}"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                    <path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </template>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 mt-auto relative z-10">
        <div class="max-w-8xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                <div class="flex items-center gap-4">
                    <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-gradient-to-br from-primary-400 to-primary-600 shadow-lg shadow-primary-500/20">
                        <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                    </div>
                    <div>
                        <h3 class="text-base font-display font-bold text-gray-900 dark:text-white">Flare</h3>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row items-center gap-4">
                    <a href="https://github.com/sponsors/alizharb" target="_blank" class="inline-flex items-center gap-2 px-3 py-1.5 text-xs font-medium text-pink-600 bg-pink-50 hover:bg-pink-100 dark:text-pink-400 dark:bg-pink-900/20 dark:hover:bg-pink-900/30 rounded-lg transition-colors">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                        </svg>
                        <span>Sponsor</span>
                    </a>
                    <div class="text-xs text-gray-500 dark:text-gray-400 text-center sm:text-right">
                        <p>&copy; <span x-text="new Date().getFullYear()"></span> <a href="https://github.com/alizharb" class="font-medium text-gray-900 dark:text-white hover:text-primary-500 transition-colors">Ali Harb</a>.</p>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script>
        function playground() {
            return {
                isDark: true,
                config: {
                    theme: 'modern',
                    position: 'top-right',
                    stacking: true
                },
                toastConfig: {
                    type: 'success',
                    title: 'Success!',
                    message: 'Your changes have been saved successfully.',
                    duration: 3000
                },
                themes: [
                    { value: 'classic', label: 'Classic' },
                    { value: 'modern', label: 'Modern' },
                    { value: 'vibrant', label: 'Vibrant' }
                ],
                types: [
                    { value: 'success', label: 'Success' },
                    { value: 'danger', label: 'Error' },
                    { value: 'warning', label: 'Warning' },
                    { value: 'info', label: 'Info' }
                ],

                toggleTheme() {
                    this.isDark = !this.isDark;
                    if (this.isDark) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                },

                showToast() {
                    const event = new CustomEvent('flare-toast-show', {
                        detail: {
                            slots: { 
                                text: this.toastConfig.message,
                                heading: this.toastConfig.title
                            },
                            dataset: {
                                variant: this.toastConfig.type,
                                position: this.config.position
                            },
                            duration: parseInt(this.toastConfig.duration) || 0
                        }
                    });
                    window.dispatchEvent(event);
                }
            }
        }
    </script>
</body>
</html>
